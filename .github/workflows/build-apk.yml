
name: Build XY8 Plaits Rings APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and Native tools
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Fetch original Mutable Instruments Plaits and Rings DSP
        run: bash scripts/fetch-mutable.sh

      - name: Build independently installable debug APK
        run: gradle --no-daemon --stacktrace -Pxy8RunNumber="$GITHUB_RUN_NUMBER" :app:assembleDebug

      - name: Give the APK a unique filename
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          filename="XY8-Plaits-Rings-Android15-run${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$filename"
          echo "XY8_APK_FILENAME=$filename" >> "$GITHUB_ENV"
          echo "Package: com.oll.xy8.run${GITHUB_RUN_NUMBER}"
          echo "APK: $filename"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: XY8-Plaits-Rings-Android15-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/${{ env.XY8_APK_FILENAME }}
          if-no-files-found: error
