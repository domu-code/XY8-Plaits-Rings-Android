name: Build XY8 Plaits Rings APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and Native tools
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch original Mutable Instruments Plaits and Rings DSP
        run: bash scripts/fetch-mutable.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XY8-Plaits-Rings-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
